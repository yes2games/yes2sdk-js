<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Yes2SDK Phaser template</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game-canvas { display: block; outline: none; }
    </style>
  </head>
  <body>
    <!-- Phaser renders into this canvas. data-yes2-canvas marks your game canvas so the
         dashboard captures the right one. No SDK <script> tags: the dashboard injects them. -->
    <canvas id="game-canvas" data-yes2-canvas></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
