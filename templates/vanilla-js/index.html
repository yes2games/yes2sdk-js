<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Yes2SDK vanilla-js template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- data-yes2-canvas marks your game canvas so the dashboard captures the right one. -->
    <canvas id="game" width="640" height="360" data-yes2-canvas></canvas>
    <div id="loading">Loading… <span id="progress">0</span>%</div>
    <div id="hud" hidden>
      <span>Coins: <strong id="coins">0</strong></span>
      <button id="play">Play level</button>
      <button id="finish" disabled>Finish level (interstitial)</button>
      <button id="reward">Watch ad: +10 coins (rewarded)</button>
    </div>
    <p id="status" role="status"></p>

    <!--
      Local development only: the Yes2SDK mock defines window.Yes2SDK so the game
      runs on your machine. When the Yes2Games Dashboard bundles this build it
      removes this tag and deletes yes2sdk-mock.js, then injects the real SDK, so
      you can leave both in your upload. (Should the tag ever survive, the mock
      sees window.Yes2SDK / window.__yes2sdkConfig and does nothing.)
    -->
    <script src="yes2sdk-mock.js"></script>
    <!-- The @yes2games/js runtime layer (window.Yes2Runtime): ad latch + watchdog, pause/mute
         helpers. It is part of YOUR game and ships in your zip. It is not the SDK. -->
    <script src="yes2-runtime.js"></script>
    <script src="main.js"></script>
  </body>
</html>
