<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Yes2SDK vanilla-ts template</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game" width="640" height="360"></canvas>
    <div id="loading">Loading… <span id="progress">0</span>%</div>
    <div id="hud" hidden>
      <span>Coins: <strong id="coins">0</strong></span>
      <button id="play">Play level</button>
      <button id="finish" disabled>Finish level (interstitial)</button>
      <button id="reward">Watch ad: +10 coins (rewarded)</button>
    </div>
    <p id="status" role="status"></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
